{% load staticfiles %}
{% load compress %}

{% compress js %}
<!-- Use unminified files for dev.  Otherwise use compressed. -->
{% if ENVIRONMENT == "dev" or ENVIRONMENT == "test" %}
    <script src="{% static "pinpoint/js/pages.js"%}"></script>
    <script src="{% static "js/jquery.viewport.js"%}"></script>
    <script src="{% static "js/jquery.masonry.min.js"%}"></script>
    <script src="{% static "js/jquery.masonry.prototypes.js"%}"></script>
    <script src="{% static "js/jquery.imagesloaded.min.js"%}"></script>
    <script src="{% static "js/mason-bricks.js"%}"></script>
    <script src="{% static "js/loadfunction.js"%}"></script>
{% else %}
    <script src="{% static "js/willet-desktop.min.js" %}"></script>
{% endif %}
{% endcompress %}
