{% load staticfiles %}
{% with media=data.media.all %}
{% with firstMedia=media|first %}

<div class="pin click datauct"
    style="overflow: hidden;"
    data-title="{{ data.name|striptags }}"
    data-desc="{{ data.description }}"
    data-price="{{ data.price|striptags }}"
    data-img="{% for url in media %}{{ url.get_url|striptags }}|{% endfor %}"
    data-url="{{ data.original_url|striptags }}"
    >
    <div class="inner-pin">
        {% autoescape off %}
        <div class="inner-pin">
            <img src="{{ firstMedia.get_url }}" />
        </div>
        <h5>{{ data.name|striptags }}</h5>
        {% endautoescape %}
    </div>
    <div class="social-hover">
        <div class="loading" style="display:none;"></div>
        <div class="buttons" style="left:-1000px;">
            <div class="pinterest_buttons">
                <a href="http://pinterest.com/pin/create/button/?url={{ data.original_url|striptags }}&media={{ firstMedia.get_url }}" target="_blank"><img src="{% static "pinpoint/images/pinpointButton.png" %}"/></a>
            </div>
            <div class="fb_buttons no_count">
                <fb:like href="{{ data.original_url|striptags }}"
                width="48"
                layout="button_count"
                show_faces="false"></fb:like>
            </div>
            <div class="twitter_buttons">
                <a href="https://twitter.com/share?url={{ data.original_url|striptags }}" target="_blank"><img src="{% static "pinpoint/images/twitterButton.png" %}"/></a>
            </div>
        </div>
    </div>
</div>

{% endwith %}
{% endwith %}
