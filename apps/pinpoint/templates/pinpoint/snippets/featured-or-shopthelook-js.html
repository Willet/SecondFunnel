{% load i18n %}
<script>
{% include 'pinpoint/snippets/file_upload_errors.html' %}

// Identical to Python's findAll
RegExp.prototype.findAll = function(string) {
    var groups = [],
        match = null;
    while (match = this.exec(string)) {
        var matches = [];
        for (var i = 1; i < match.length; ++i)
            matches.push(match[i]);
        groups.push(matches);
    }
    return groups;
};


var application = (function(store_id, urls){
    var $pageChanged = $('#id_page_changed'),
        createUploader,
        productSelected,
        setProductFields,
        ready,
        init,
        getAutoCompleteConfig,
        onPageChanged,
        onImageSelect,
        onPreview,
        onCancel,
        onBack,
        onProductApiResults,
        products = {},
        media_api_url = "/api/assets/v1/" + ((campaign_id.length > 0)? "product_media": "generic_image") + "/";

    batchDelete = function (uris) {
        // Consumes uris pointing to valid resources and deletes them
        $.ajax({
            async: false,
            headers: {"X-HTTP-Method-Override": "PATCH"}, 
            type: "PATCH",
            url: media_api_url,
            data: JSON.stringify({
                "format": "json",
                "objects": [],
                "deleted_objects": uris
            }),
            contentType: "application/json",
            success: function(response) {
                return true;                    
            },
            error: function(jqXHR, status, error) {
                console.log(error);
            }
        });
        return false;
    };

    setProductFields = function (product, data) {
        // set product's proper name
        $("#product_name").val(product.name);

        if (!data.human_invoked) {
            $("#id_name").val(data.page_name);
        } else {
            // resetting previous values
            $("#id_product_media_id, #id_ls_product_media_id").val("");
            $("#id_product_media_list, id_ls_product_media_list").val("");

            //TODO: Why here?
            onPageChanged();

            $("#id_name").val(
                "{{ block_type.name|default:'Featured' }}: " + product.name
            );
        }

        // fire change event so validator updates
        $("#id_name").change();

        $("#id_description").val(data.product_description || product.description);

        // fire change event so validator updates
        $("#id_description").change();

        // set the id for form submission
        $("#id_product_id").val(product.id);
    };

    productSelected = function(data) {
        // populate product media (image selection)
        var product = products[data.product_id];

        // Hide errors
        $(".image-selector").siblings(".errorlist").children("li").fadeIn(500);

        if (data.product_id === "") {
            return;
        }

        if (typeof(product) === "undefined") {
            $.getJSON("/api/assets/v1/product/" + data.product_id, {
                "format": "json",
                "store": store_id

            }, function(result) {
                products[result.id] = {
                    'id'         : result.id,
                    'name'       : result.name,
                    'description': result.description,
                    'media'      : []
                };

                // fetch product media
                $.getJSON("/api/assets/v1/product_media/", {
                    "format": "json",
                    "product": result.id,
                    "store": store_id
                }, function(media_data) {
                    if (media_data.meta.total_count === 0) {
                        return onProductApiResults(data, products[data.id]);
                    }

                    for (media_result in media_data.objects) {
                        var media = media_data.objects[media_result],
                            media_result;

                        products[result.id]['media'].push({
                            'id': media.id,
                            'url': media.hosted || media.remote,
                            'custom': media.custom
                        });
                    }

                    return onProductApiResults(data, products[result.id]);
                });
            });
        } else {
            return onProductApiResults(data, product);
        }


    };

    onProductApiResults = function (data, product) {
        var i,
            li,
            uploadedImages;

        // clear image list
        $('.product-images').each(function(index, elem) {
            var $images = $(elem).find('li');

            imagesToRemove = $images.splice(1, $images.length - 1);

            for (var i = imagesToRemove.length - 1; i >= 0; i--) {
                $(imagesToRemove[i]).remove();
            }
        });

        // display uploaded media first
        if (campaign_id.length == 0) {
            var new_media = /(?:(.+?)\\(\d+?)(?:\||$))/g.findAll($("#id_product_media_list").val());
            $.each(new_media, function(i, match) {
                var url = match[0],
                    id = match[1];
                console.log(match);
                li = $("<li><img class='gen_img' data-mid='" + id + "' src='" + url + "'></li>");
                li.prepend($("<span class='ui-state-default'><span class='ui-icon ui-icon-circle-close'></span></span>"));
                console.log(li);
                $(".product-images").append(li);
            });
        }

        // display product media
        for (i in product.media) {
            li = $("<li><img class='prod_img' data-mid='" + product.media[i].id + "' src='" + product.media[i].url + "'></li>");

            if (product.media[i].custom) {
                li.prepend($("<span class='ui-state-default'><span class='ui-icon ui-icon-circle-close'></span></span>"));
            }
            $(".product-images").append(li);
        }

        $("#look_images").find("[data-mid='" + data.ls_image_id  + "']").addClass("selected");
        $("#product_images").find("[data-mid='" + data.product_image_id  + "']").addClass("selected");
        $('.image-selector').has('.selected').siblings(".errorlist").children("li").hide();

        // Update other product fields
        setProductFields(product, data);

        $(".product_meta").unmask();
    };

    onPageChanged = function() {
        $pageChanged.val('true');
    };

    getAutoCompleteConfig = function () {
        return {
            source: function(request, response) {
                var term = request.term;
                $.getJSON('/api/assets/v1/product/', {
                    'store': store_id,
                    'format': 'json',
                    'name_or_url': term

                }, function(data) {
                    //convert object to usable form
                    var results = [];
                    $.each(data.objects, function(index, value) {
                        results.push({'label': value.name, 'id': value.id})
                    });
                    response(results);
                })
            },
            minLength: 2,
            select: function( event, ui ) {
                if (ui.item) {
                    productSelected({
                        product_id: ui.item.id,
                        human_invoked: true
                    });
                }
            }
        };
    };

    onImageSelect = function () {
        var $elem = $(this),
            $image = $elem,
            $field  = $elem.parents('.field'),
            fields,
            mid = $image.data('mid'),
            image_fields = {
                'featured': $('#id_product_media_id'),
                'look': $('#id_ls_product_media_id')
            };

        if ($field.hasClass('featured')) {
            fields = image_fields.featured;
        } else {
            fields = image_fields.look;
        }

        // Hide related errors
        $field.find('.image-selector').siblings('.errorlist').children('li').fadeOut(500);

        // Remove selected classes...
        $image.parents('.product-images').find('img').removeClass('selected');

        // ...and add to selected element
        $image.addClass('selected');
        fields.val(mid);
    };

    onPreview = function () {
        var $form = $('#create_campaign'),
            $campaign_id = $('#id_campaign_id');
        // Since we're saving, ensure to delete images
        onDeleteImages();

        $.ajax({
            async: false,
            type: 'POST',
            data: $form.serialize(),
            url: window.location.href,
            success: function(response) {
                if (response.success) {
                    var url = 'http://' + window.location.host + response.url;
                    window.open(url, '_blank');
                    $campaign_id.val(response.campaign);
                    getAutoCompleteConfig();
                } else {
                    $form[0].submit();
                }
            }
        });
    };

    onDeleteImages = function () {
        // Before we submit the form, we need to ensure that any deleted
        // images (ones we've hidden), are actually deleted through a batch request.
        var uris = [],
            $media_list = $("#id_product_media_list");

        $('#product_images img:hidden').each(function(){
            var id = $(this).attr('data-mid'),
                url = $(this).attr('src');
            $media_list.val($media_list.val().replace(url + "\\" + id, ""));
            uris.push(media_api_url + id + "/");
        });
        $('#product_images img:hidden').remove();
        batchDelete(uris);
    };

    onRefresh = function () {
        // We'll assume a refresh triggers a save
        // TODO: Should we assume this?  Or clear the entire page?
        var $form = $('#create_campaign'),
            new_media = /(?:(.+?)\\(\d+?)(?:\||$))/g.findAll($("#id_product_media_list").val());
            
        if (new_media.length > 0) {
            new_media = $.map(new_media, function(match) {
                return media_api_url + match[1] + "/";
            });
            batchDelete(new_media);
        }
    };

    onFormSubmit = function(e) {
        // Before we save the page, ensure we delete all
        // the images we specified.
        e.preventDefault();
        $(window).unbind('beforeunload', onRefresh);

        var $form = $('#create_campaign');
        onDeleteImages();
        $form[0].submit();
    };

    onCancel = function(){
        var cancel;

        if ($pageChanged.val()) {
            cancel = confirm("{% trans "Are you sure you want to cancel your changes?" %}");
        }

        if (cancel || !$pageChanged.val()) {
            // Delete all the images uploaded in the session
            // Assume the user doesn't want them? (They are cancelling their changes after all!)
            var new_media = /(?:(.+?)\\(\d+?)(?:\||$))/g.findAll($("#id_product_media_list").val());
            
            if (new_media.length > 0) {
                new_media = $.map(new_media, function(match) {
                     return media_api_url + match[1] + "/";
                });
                batchDelete(new_media);
            }
            window.location.href = urls['store-admin'];
        }
    };

    onBack = function(){
        var cancel;

        if ($pageChanged.val()) {
            var cancel = confirm("{% trans "By going back you will lose your changes on this page. Are you sure?" %}");
        }

        if (cancel || $pageChanged.val()) {
            window.location.href = urls['new-campaign-admin'];
        }
    };

    onImageDelete = function() {
        var id = $(this).parent().next().attr('data-mid'),
            $products = $('img[data-mid="' + id + '"]'),
            $field  = $(this).parents('.field');
            
        $products.each(function(){
            var $image = $(this);
            
            if ($image.hasClass('selected')) {
                $image.removeClass('selected');

                if ($field.hasClass('featured')) {
                    $('#id_product_media_id').val("");
                } else {
                    $('#id_ls_product_media_id').val("");
                }
            }
            $image.parent().hide();
        });
    };

    createUploader = function($elem) {
        var uploader,
            $productImages = $('.product-images');

        uploader = new qq.FileUploader({
            element: $elem[0],
            action: urls['ajax-image-upload'],
            csrfToken: $.cookie('csrftoken'),
            allowedExtensions: ['jpg' ,'png', 'jpeg'],
            onSubmit: function() {
                $('.fine-uploader').closest('li').after(
                    '<li><img class=\'loading_gif\' src=\'' +
                        urls['loading-gif'] +
                        '\'></li>'
                );
            },
            onComplete: function(id, fileName, response) {
                var decodedUrl, gif, li;

                if (response.success) {
                    decodedUrl = $(document.createElement('div')).html(response.url).text();
                    gif = $productImages.find('.loading_gif');
                    
                    gif.hide();
                    gif.removeClass('loading_gif');
                    gif.addClass('prod_img');
                    gif.attr('src', decodedUrl);
                    gif.attr('data-mid', response.media_id);
                    gif.data('mid', response.media_id);
                    gif.parent().prepend($("<span class='ui-state-default'><span class='ui-icon ui-icon-circle-close'></span></span>"));
                    gif.load(function() {
                        gif.fadeIn(500);
                        if ($productImages.length == 1) {
                            gif.click();
                        }
                    });
                    
                    $("#id_product_media_list").val($("#id_product_media_list").val() + decodedUrl + "\\" + response.media_id + "|");
                    if (campaign_id.length == 0) {
                        $("#id_generic_image_list").val($("#id_product_media_list").val());
                    }
                } else {
                    if (response.error) {
                        fileUploadErrorHandler.signalError(response.error, fileName);    
                    }

                    gif = $productImages.find('.loading_gif');
                    li = gif.closest('li');
                    li.addClass('broken_image');
                    gif.remove();
                    li.html('<div class="rounded"><ul class="errorlist"><li>{% trans "Error uploading image." %}' +
                            '</li><br /><li>{% trans "Click this box to dismiss." %}</li></ul></div>')

                    $("li.broken_image").on('click', function() {
                        $(this).animate({
                            width: 0,
                            margin: 0,
                            padding: 0
                        }, 500, function() {
                            $(this).remove();
                        });
                    });
                }
            }
        });

        return uploader;
    };

    ready = function() {
        var descriptionObj = $('#id_description');
        descriptionObj.htmlarea({
            toolbar: [
                ["bold", "italic", "underline"],
                ["link", "unlink"]
            ]
        });

        descriptionObj.on('change', function () {
            descriptionObj.htmlarea('updateHtmlArea');
        });
        $('#product_name').autocomplete(getAutoCompleteConfig());
        $('.button.preview').on('click', onPreview);
        $('#cancel_to_admin').unbind('click').on('click', onCancel);
        $('.button.back:not(.disabled)').on('click', onBack);
        $('#create_campaign').on('submit', onFormSubmit);

        $('.product-images').on('click', 'img', onImageSelect);
        $('body').on('mouseenter', '.ui-state-default', function(){
            $(this).addClass('ui-state-active');
        }).on('mouseleave', '.ui-state-default', function(){
            $(this).removeClass('ui-state-active');
        });

        // Hide an element when it's *deleted*
        $('body').on('click', '.ui-icon-circle-close', onImageDelete);

        // Bind refresh listener
        $(window).bind('beforeunload', onRefresh);

        // Trigger page changed events
        $('.product-images').on('click', 'img', onPageChanged);
        $('#id_name, #id_description').change(onPageChanged);
        $('#id_name, #id_description').keyup(onPageChanged);
    };

    init = function() {
        var uploader;

        $(".product_meta").mask();
        $("#product_name").watermark("{% trans "Your product name" %}");
        $("#id_name").watermark("{% trans "Your page name" %}");
        $("#id_description").watermark("{% trans "Featured product description" %}");

        $(document).ready(ready);

        //create uploaders
        $('.fine-uploader').each(function(index, elem) {
            createUploader($(elem));
        });

        // select product
        productSelected({
            product_id                : $("#id_product_id").val(),
            page_name                 : $("#id_name").val(),
            product_description       : $("#id_description").val(),
            product_image_id          : $("#id_product_media_id").val(),
            ls_image_id               : $("#id_ls_product_media_id").val(),
            product_media_list        : $("#id_product_media_list").val(),
            generic_image_list        : $("#id_generic_image_list").val()
        });

        $(".qq-upload-button").addClass('button');
    };

    return {
        'init': init
    }

})(window.store, window.url_list || {});

application.init();
</script>
