{% load staticfiles %}
{% load compress %}

{% compress js %}
<script type="text/javascript">
    if (!$.browser.mobile || $.browser.tablet) {
        (function () {
            var salvattore = document.createElement('script');
            salvattore.type = 'text/javascript';
            salvattore.src = 'js/salvattore.js';

            var facebookConnect = document.createElement('script');
            facebookConnect.type = 'text/JavaScript';
            facebookConnect.src = '//connect.facebook.net/en_US/all.js';

            $('body').append(facebookConnect).
            append(salvattore);
        }());
    }
</script>
<script type="text/javascript">
    if (window.SecondFunnel) {
        // Start the SecondFunnel app
        SecondFunnel.start();
        window.sizeImage = SecondFunnel.utils.pickImageSize;  // export for designers
    }
</script>
<script type="text/javascript" src="{% static 'js/css3-mediaqueries.js' %}"></script><!-- IE8 -->
{% endcompress %}
<!-- End Javascript -->

<!-- Social -->
<div id="fb-root"></div>
<!-- End Social -->
